<text x="80" y="632" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#1b2b40" text-anchor="start" font-weight="400">JA1  ·  Latch  →  Due D2</text>
<text x="80" y="672" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#1b2b40" text-anchor="start" font-weight="400">JA2  ·  Pulse / clock  →  Due D3</text>
<text x="80" y="712" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#1b2b40" text-anchor="start" font-weight="400">JA3  ·  Serial data  ←  Due D4</text>
<rect x="740" y="555" width="644" height="190" rx="12" fill="#ffffff" stroke="#d7dfe8" stroke-width="2"/>
<text x="764" y="590" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#8853aa" text-anchor="start" font-weight="700">PLAYER 2  /  NES CONTROLLER</text>
<text x="764" y="632" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#1b2b40" text-anchor="start" font-weight="400">JA7  ·  Latch  →  Due D5</text>
<text x="764" y="672" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#1b2b40" text-anchor="start" font-weight="400">JA8  ·  Pulse / clock  →  Due D6</text>
<text x="764" y="712" font-family="DejaVu Sans,sans-serif" font-size="24" fill="#1b2b40" text-anchor="start" font-weight="400">JA9  ·  Serial data  ←  Due D7</text>
<text x="56" y="791" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#198467" text-anchor="start" font-weight="700">JA4 → U1 A1: FPGA 3.3 V → LED 5 V data. JA10: spare.</text>
<text x="56" y="831" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#1b2b40" text-anchor="start" font-weight="400">JA5 / JA11: common GND. JA6: 3.3 V for R6 / R7 (10 kΩ NES data pull-ups).</text>
<text x="56" y="871" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#1b2b40" text-anchor="start" font-weight="400">JA12: leave unconnected. Never apply 5 V to JA or join FPGA and Due 3.3 V rails.</text>
<text x="56" y="907" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#53657a" text-anchor="start" font-weight="400">Latch / pulse: FPGA → Due. Serial data: Due → FPGA, LOW or Hi-Z. Not a mechanical drawing.</text>
